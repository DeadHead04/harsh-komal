services:
  - type: web
    name: harsh-komal
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: SQLITE_PATH
        value: /var/data/wishes.sqlite
    disk:
      name: wishes-data
      mountPath: /var/data
      sizeGB: 1
